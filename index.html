<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Novak &amp; Capelari — imagens</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<style>
  :root{
    --espresso:#301519;
    --dourado:#907D4A;
    --papel:#FDFBF7;
    --texto:#2A1A17;
    --suave:#8B7F6E;
  }
  body{
    margin:0;
    background:var(--papel);
    color:var(--texto);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    display:grid;
    place-items:center;
    min-height:100vh;
    padding:24px;
    box-sizing:border-box;
  }
  .cartao{max-width:460px;text-align:center}
  h1{
    font-family:Garamond,Georgia,serif;
    font-size:27px;
    color:var(--dourado);
    font-weight:500;
    margin:0 0 8px;
    line-height:1.15;
  }
  p{color:var(--suave);font-size:14px;margin:0}
  .faixa{
    margin-top:24px;
    background:var(--espresso);
    color:var(--dourado);
    padding:13px 20px;
    font-family:Garamond,Georgia,serif;
    font-size:18px;
    display:inline-block;
  }
  .faixa span{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:.16em;
    color:#CBC1AB;
    margin-left:8px;
  }
</style>
<div class="cartao">
  <h1>Novak &amp; Capelari</h1>
  <p>Endereço de imagens das assinaturas de e-mail do escritório.<br>
     Não há conteúdo para visitantes nesta página.</p>
  <div class="faixa">10 anos <span>2016 · 2026</span></div>
</div>
